title: "김우석의 기술 블로그"
description: "Git · Linux · Oracle · SharePlex · Snowflake 기술 공부 기록"
author:
  name: "김우석"

url: "https://kws9507-ops.github.io"
baseurl: "/kws-blog"

remote_theme: "mmistakes/minimal-mistakes"

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag

minimal_mistakes_skin: "default"

markdown: kramdown

search: true

breadcrumbs: true

paginate: 10
paginate_path: /page:num/

locale: "ko-KR"

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
